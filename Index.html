<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibrahim | Personal Website</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#101827;color:white}
header{padding:25px 10%;display:flex;justify-content:space-between}
.logo{color:#38bdf8;font-size:25px;font-weight:bold}
nav a{color:white;text-decoration:none;margin-left:20px}
.hero{text-align:center;padding:120px 20px}
.hero h1{font-size:50px;margin-bottom:15px}
.hero h1 span{color:#38bdf8}
.hero p{color:#aaa;font-size:17px;margin-bottom:25px}
button{background:#38bdf8;color:#101827;border:0;
padding:12px 25px;border-radius:8px;cursor:pointer;font-weight:bold}
button:hover{background:white;transform:scale(1.05)}
section{text-align:center;padding:60px 20px}
.card{background:#1e293b;padding:30px;margin:20px auto;
max-width:500px;border-radius:15px}
footer{text-align:center;padding:25px;color:#888}
</style>
</head>
<body>

<header>
<div class="logo">IBRAHIM.</div>
<nav>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>
</header>

<section class="hero" id="home">
<h1>Hey, I'm <span>Ibrahim</span></h1>
<p>Welcome to my personal website.</p>
<button onclick="sayHello()">Say Hello 👋</button>
</section>

<section id="about">
<h2>About Me</h2>
<div class="card">
<h3>I'm Ibrahim</h3>
<p style="margin-top:15px;color:#aaa">
I'm a creative person who loves technology,
learning new things and exploring the internet.
</p>
</div>
</section>

<section id="contact">
<h2>Contact Me</h2>
<div class="card">
<p>Want to connect with me?</p>
<button onclick="contactMe()">Get In Touch</button>
</div>
</section>

<footer>
<p>© 2026 Ibrahim. All rights reserved.</p>
</footer>

<script>
function sayHello(){
alert("Hello! Welcome to Ibrahim's website!");
}
function contactMe(){
alert("Thanks for visiting! Contact Ibrahim soon.");
}
console.log("Ibrahim's website is running!");
</script>

</body>
</html>
